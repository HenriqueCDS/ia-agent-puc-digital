<!doctype html>
<!--
  Revisão de Avaliação — dashboard (Chart.js) + conferência manual de fidelidade.

  Chart.js é servido de /revisao/chart.js (vendorizado em app/static/vendor/,
  NÃO de CDN): a página continua abrindo numa máquina sem internet e sem
  depender de host de terceiro. Fora isso, nenhum recurso externo. Paleta e
  renderizador de markdown são os mesmos da demo (app/static/index.html).

  Fonte dos dados (ver app/api/routers/revisao.py):
    GET  /revisao/dados      dataset (exemplo_perguntas) × última execução
                             (telemetria, canal `eval`) × veredito, + agregados
                             (`resumo`) e o array `fluxo` (métricas cruas por
                             pergunta executada, de onde saem os histogramas)
    GET  /revisao/serie      execuções por dia
    PUT  /revisao/veredicto           grava satisfeito/insatisfeito/pulado de UMA resposta
    PATCH /revisao/pergunta/{id}      ajusta a expectativa (origem_esperada / também_ok)

  A telemetria NUNCA guarda o texto da pergunta — ele vem de exemplo_perguntas,
  casado por pergunta_hash.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisão de Avaliação · Agente de Suporte Acadêmico</title>
<script src="/revisao/chart.js"></script>
<style>
  :root {
    --marca: #003383;
    --marca-forte: #00276a;
    --fundo: #f7fafd;
    --superficie: #ffffff;
    --superficie-2: #eef2f8;
    --borda: #dbe3ee;
    --texto: #161615;
    --texto-fraco: #5d6675;
    --base: #2f7d4f;
    --base-fundo: #e6f2ea;
    --web: #8a6410;
    --web-fundo: #faf1dc;
    --encaminhado: #1f6d74;
    --encaminhado-fundo: #e2f1f2;
    --nenhuma: #5d6675;
    --nenhuma-fundo: #eceef2;
    --erro: #93050d;
    --erro-fundo: #fbeaea;
    --raio: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --marca: #7ba7e8;
      --marca-forte: #9cbef0;
      --fundo: #12151c;
      --superficie: #1a1f2b;
      --superficie-2: #232a38;
      --borda: #2f3848;
      --texto: #e6eaf2;
      --texto-fraco: #98a2b5;
      --base: #7fc79b;
      --base-fundo: #1a3a29;
      --web: #dfb256;
      --web-fundo: #3a2f16;
      --encaminhado: #6fc3cb;
      --encaminhado-fundo: #12363a;
      --nenhuma: #98a2b5;
      --nenhuma-fundo: #2a3140;
      --erro: #f0959b;
      --erro-fundo: #3a1518;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--borda);
    background: var(--superficie); position: sticky; top: 0; z-index: 3;
  }
  .marca-svg { width: 34px; height: 34px; flex: none; color: var(--marca); }
  .divisor { width: 1px; height: 30px; background: var(--borda); flex: none; }
  .titulo { font-weight: 600; letter-spacing: -0.01em; }
  .subtitulo { font-size: 12px; color: var(--texto-fraco); }
  header .direita { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  select {
    font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 9px;
    border: 1px solid var(--borda); background: var(--superficie-2); color: var(--texto);
  }
  .abas { display: flex; gap: 4px; background: var(--superficie-2); padding: 3px; border-radius: 10px; }
  .abas button {
    font: inherit; font-size: 13px; cursor: pointer; border: 0; border-radius: 8px;
    padding: 6px 14px; background: transparent; color: var(--texto-fraco);
  }
  .abas button[aria-selected="true"] { background: var(--superficie); color: var(--texto); font-weight: 600; }

  main { flex: 1; overflow-y: auto; padding: 18px 20px 40px; }
  .painel { max-width: 1080px; margin: 0 auto; }

  .centro { text-align: center; padding: 54px 0; color: var(--texto-fraco); }
  .centro h1 { font-size: 20px; color: var(--texto); margin: 0 0 8px; letter-spacing: -0.02em; }
  .aviso {
    border: 1px solid var(--borda); border-left: 3px solid var(--erro);
    background: var(--erro-fundo); color: var(--erro);
    padding: 10px 14px; border-radius: 10px; font-size: 14px; margin: 12px auto; max-width: 560px;
  }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .tile { background: var(--superficie); border: 1px solid var(--borda); border-radius: 12px; padding: 12px 14px; }
  .tile .n { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tile .r { font-size: 11.5px; color: var(--texto-fraco); }
  .tile .s { font-size: 11px; color: var(--texto-fraco); margin-top: 2px; }
  .tile.bom .n { color: var(--base); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  .card { background: var(--superficie); border: 1px solid var(--borda); border-radius: 12px; padding: 14px 16px; }
  .card.wide { grid-column: 1 / -1; }
  .card h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  .card p.sub { margin: 0 0 8px; font-size: 11.5px; color: var(--texto-fraco); }
  .chart-wrap { position: relative; height: 230px; }
  .chart-wrap.alta { height: 300px; }
  .vazia { color: var(--texto-fraco); font-style: italic; font-size: 13px; }

  table.tab { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.tab th, table.tab td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--borda); }
  table.tab th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--texto-fraco); }
  table.tab td.num { text-align: right; font-variant-numeric: tabular-nums; }

  .barra-exp { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0 0; }
  .barra-exp button { font: inherit; font-size: 13px; cursor: pointer; padding: 9px 14px; border-radius: 10px;
    border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); }
  .barra-exp button:hover { border-color: var(--marca); }

  /* ---------- conferência ---------- */

  .progresso .trilha { flex: 1; height: 6px; border-radius: 999px; background: var(--superficie-2); overflow: hidden; }
  .progresso .trilha span { display: block; height: 100%; background: var(--marca); width: 0; transition: width .2s; }
  .cont { display: inline-flex; gap: 9px; font-variant-numeric: tabular-nums; }
  .cont .cs { color: var(--base); } .cont .ci { color: var(--erro); } .cont .cp { color: var(--texto-fraco); }

  /* lista de pendentes */
  .lista-pend { border: 1px solid var(--borda); border-radius: 12px; background: var(--superficie); margin-bottom: 14px; }
  .lista-pend > summary {
    cursor: pointer; padding: 10px 14px; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 10px; list-style: none;
  }
  .lista-pend > summary::-webkit-details-marker { display: none; }
  .lista-pend > summary::before { content: "▸"; color: var(--texto-fraco); font-size: 11px; }
  .lista-pend[open] > summary::before { content: "▾"; }
  .lista-pend .badge-n { background: var(--web-fundo); color: var(--web); font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
  .lista-pend .badge-n.zero { background: var(--base-fundo); color: var(--base); }

  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

  .seta { color: var(--texto-fraco); font-size: 12px; }

  .rot-secao { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--texto-fraco); margin: 16px 0 6px; }
  .resposta { white-space: normal; }
  .resposta p { margin: 0 0 10px; } .resposta ul, .resposta ol { margin: 0 0 10px; padding-left: 22px; }
  .resposta li { margin-bottom: 4px; }
  .resposta code { background: var(--superficie-2); padding: 1px 5px; border-radius: 5px; font-family: ui-monospace, Consolas, monospace; font-size: 0.9em; }

  .criterio { border: 1px solid var(--borda); border-left: 3px solid var(--web); background: var(--web-fundo); padding: 10px 14px; border-radius: 10px; font-size: 14px; margin-top: 12px; }

  .expectativa { background: var(--superficie-2); border: 1px solid var(--borda); border-radius: 10px; padding: 12px 14px; margin-top: 16px; display: flex; flex-direction: column; gap: 9px; }
  .expectativa.aj { border-color: var(--marca); }
  .expectativa .linha { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

  .vr { font-size: 13px; } .vr b[data-ok="sim"] { color: var(--base); } .vr b[data-ok="nao"] { color: var(--erro); }
  .vr .antes { color: var(--texto-fraco); font-size: 12px; }

  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 7px 13px; font-size: 12.5px; margin-top: 6px; }
  .grade div { display: flex; flex-direction: column; }
  .grade dt { color: var(--texto-fraco); font-size: 11px; }
  .grade dd { margin: 0; font-variant-numeric: tabular-nums; }

  details.crua { margin-top: 12px; font-size: 12px; }
  details.crua summary { cursor: pointer; color: var(--texto-fraco); }
  details.crua pre { margin: 8px 0 0; padding: 12px; background: var(--superficie-2); border: 1px solid var(--borda); border-radius: 10px; overflow-x: auto; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }

  .acoes {
    position: sticky; bottom: 0; margin-top: 14px; padding: 12px 0 4px;

    display: flex; gap: 10px; align-items: center;
  }
  .acoes .nav { font: inherit; font-size: 13px; cursor: pointer; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); }
  .acoes .nav:disabled { opacity: .4; cursor: default; }
  .voto { flex: 1; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  .voto:disabled { opacity: .4; cursor: default; }

  .voto.pulo:hover, .voto.pulo[aria-pressed="true"] { border-color: var(--texto-fraco); background: var(--superficie-2); }

  @media (max-width: 560px) {
    header { flex-wrap: wrap; } header .direita { width: 100%; margin-left: 0; }
    .acoes { flex-wrap: wrap; } .voto { flex-basis: 100%; }
  }
</style>

<body>

<header>
  <svg class="marca-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M8 3h6l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span class="divisor" aria-hidden="true"></span>
  <div>
    <div class="titulo">Revisão de Avaliação</div>
    <div class="subtitulo">telemetria do canal <code>eval</code> &middot; scripts.eval_run</div>
  </div>
  <div class="direita">
    <div class="abas" role="tablist">
      <button role="tab" data-modo="dashboard" aria-selected="true">Visão geral</button>
      <button role="tab" data-modo="revisao" aria-selected="false">Conferir</button>
    </div>
    <select id="f-dias" aria-label="Janela">
      <option value="7">7 dias</option>
      <option value="30">30 dias</option>
      <option value="90" selected>90 dias</option>
      <option value="365">1 ano</option>
    </select>
    <select id="f-grupo" aria-label="Grupo"><option value="">Todos os grupos</option></select>
    <select id="f-origem" aria-label="Origem obtida">
      <option value="">Todas as origens</option>
      <option value="base">base</option>
      <option value="web">web</option>
      <option value="encaminhado">encaminhado</option>
      <option value="nenhuma">nenhuma</option>
    </select>
  </div>
</header>

<main>
  <div class="painel" id="painel">
    <div class="centro" id="carregando"><p>Carregando…</p></div>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

const VEREDICTOS = {
  satisfeito:   { rotulo: "Satisfeito",   classe: "sat",   tecla: "1 / S" },
  insatisfeito: { rotulo: "Insatisfeito", classe: "insat", tecla: "2 / I" },
  pulado:       { rotulo: "Pular",        classe: "pulo",  tecla: "3 / P" },
};
const ORIGENS = {
  base: "material interno", web: "página oficial", encaminhado: "encaminhado",
  nenhuma: "sem resposta", provedores_indisponivel: "provedores fora",
};
const ORIGENS_ESPERAVEIS = ["base", "web", "encaminhado", "nenhuma"];

const estado = {
  filtros: { dias: 90, grupo: "", origem: "" },
  linhas: [], resumo: null, serie: [],
  modo: "dashboard", idx: 0,
};
const charts = {};

/* ---------- texto (igual à demo) ---------- */
function escapar(t) {
  return String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function inline(txt) {
  return txt.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/(https?:\/\/[^\s<]+[^\s<.,;:)])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}
function renderizarResposta(texto) {
  const linhas = escapar(texto).split("\n");
  let html = "", lista = null, par = [];
  const fp = () => { if (par.length) { html += "<p>" + inline(par.join(" ")) + "</p>"; par = []; } };
  const fl = () => { if (lista) { html += `</${lista}>`; lista = null; } };
  for (const bruta of linhas) {
    const l = bruta.trim();
    if (!l) { fp(); fl(); continue; }
    const m = l.match(/^[-*•]\s+(.*)$/), n = l.match(/^\d+[.)]\s+(.*)$/);
    const tipo = m ? "ul" : n ? "ol" : null;
    if (tipo) { fp(); if (lista !== tipo) { fl(); html += `<${tipo}>`; lista = tipo; } html += "<li>" + inline((m || n)[1]) + "</li>"; }
    else { fl(); par.push(l); }
  }
  fp(); fl();
  return html;
}

/* ---------- carga ---------- */
async function carregar() {
  const q = new URLSearchParams({ dias: estado.filtros.dias });
  if (estado.filtros.grupo) q.set("grupo", estado.filtros.grupo);
  if (estado.filtros.origem) q.set("origem", estado.filtros.origem);
  try {
    const [rd, rs] = await Promise.all([
      fetch("/revisao/dados?" + q),
      fetch("/revisao/serie?dias=" + estado.filtros.dias),
    ]);
    if (!rd.ok) throw new Error("HTTP " + rd.status + " em /revisao/dados");
    const dados = await rd.json();
    estado.linhas = dados.linhas;
    estado.resumo = dados.resumo;
    estado.serie = rs.ok ? (await rs.json()).pontos : [];
    preencherGrupos(dados.filtros.grupos_disponiveis);
    estado.idx = Math.max(0, estado.linhas.findIndex((l) => l.executada && !l.veredicto));
    render();
  } catch (e) {
    $("painel").innerHTML = `<div class="aviso">Não foi possível carregar: ${escapar(e.message)}<br>
      <span style="font-size:12px">Se o servidor foi iniciado antes desta versão, reinicie o uvicorn.</span></div>`;
  }
}

let gruposPreenchidos = false;
function preencherGrupos(grupos) {
  if (gruposPreenchidos) return;
  for (const g of grupos) $("f-grupo").insertAdjacentHTML("beforeend", `<option value="${escapar(g)}">${escapar(g)}</option>`);
  gruposPreenchidos = true;
}

function render() {
  document.querySelectorAll(".abas button").forEach((b) =>
    b.setAttribute("aria-selected", b.dataset.modo === estado.modo));
  if (!estado.resumo) return;
  if (estado.modo === "dashboard") renderDashboard();
  else { destruirCharts(); renderRevisao(); }
}

/* ==================== DASHBOARD (Chart.js) ==================== */

const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function paleta() {
  return [css("--marca"), css("--base"), css("--web"), css("--encaminhado"), css("--erro"),
    css("--texto-fraco"), "#8b5cf6", "#0ea5e9", "#f59e0b", "#ec4899", "#14b8a6", "#a3a3a3"];
}
const CORES_ORIGEM = () => ({
  base: css("--base"), web: css("--web"), encaminhado: css("--encaminhado"),
  nenhuma: css("--nenhuma"), "—": css("--borda"),
});

function destruirCharts() { for (const k in charts) { charts[k].destroy(); delete charts[k]; } }

function graf(id, cfg) {
  const el = $(id);
  if (!el) return;
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(el, cfg);
}
const OPTS_BASE = {
  responsive: true, maintainAspectRatio: false,
  plugins: { legend: { labels: { boxWidth: 12, font: { size: 11 } } } },
};

function doughnut(id, obj, coresPorChave) {
  const labels = Object.keys(obj), valores = Object.values(obj);
  const cores = coresPorChave ? labels.map((k) => coresPorChave[k] || css("--borda")) : paleta();
  graf(id, {
    type: "doughnut",
    data: { labels, datasets: [{ data: valores, backgroundColor: cores, borderWidth: 0 }] },
    options: { ...OPTS_BASE, cutout: "58%" },
  });
}

function barra(id, obj, { cor, horizontal = false, max } = {}) {
  const labels = Object.keys(obj), valores = Object.values(obj);
  graf(id, {
    type: "bar",
    data: { labels, datasets: [{ data: valores, backgroundColor: cor || css("--marca"), borderRadius: 3 }] },
    options: {
      ...OPTS_BASE, indexAxis: horizontal ? "y" : "x",
      plugins: { legend: { display: false } },
      scales: { x: { grid: { display: !horizontal } }, y: { grid: { display: horizontal }, max, beginAtZero: true } },
    },
  });
}

function empilhado(id, labels, datasets, { horizontal = true } = {}) {
  graf(id, {
    type: "bar",
    data: { labels, datasets: datasets.map((d) => ({ ...d, borderRadius: 2 })) },
    options: {
      ...OPTS_BASE, indexAxis: horizontal ? "y" : "x",
      scales: { x: { stacked: true, beginAtZero: true }, y: { stacked: true } },
    },
  });
}

// Histograma no cliente: bina o array e devolve p/ um bar chart.
function histograma(id, valores, { cor, bins = 12, fmt = (v) => Math.round(v), titulo } = {}) {
  const vals = (valores || []).filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
  const wrap = $(id) && $(id).closest(".card");
  if (!vals.length) { if (wrap) wrap.querySelector(".chart-wrap").innerHTML = `<p class="vazia">sem dados</p>`; return; }
  const min = Math.min(...vals), max = Math.max(...vals);
  let labels, counts;
  if (min === max) { labels = [fmt(min)]; counts = [vals.length]; }
  else {
    const w = (max - min) / bins;
    counts = new Array(bins).fill(0);
    for (const v of vals) counts[Math.min(bins - 1, Math.floor((v - min) / w))]++;
    labels = counts.map((_, i) => fmt(min + i * w));
  }
  graf(id, {
    type: "bar",
    data: { labels, datasets: [{ data: counts, backgroundColor: cor || css("--marca"), borderRadius: 2, barPercentage: 1, categoryPercentage: 1 }] },
    options: {
      ...OPTS_BASE,
      plugins: { legend: { display: false }, title: titulo ? { display: true, text: titulo, font: { size: 11 } } : {} },
      scales: { x: { grid: { display: false }, ticks: { font: { size: 9 }, maxRotation: 0 } }, y: { beginAtZero: true, ticks: { precision: 0 } } },
    },
  });
}

function card(id, titulo, sub, alta) {
  return `<div class="card"><h3>${escapar(titulo)}</h3>${sub ? `<p class="sub">${escapar(sub)}</p>` : ""}
    <div class="chart-wrap ${alta ? "alta" : ""}"><canvas id="${id}"></canvas></div></div>`;
}
function cardWide(id, titulo, sub, alta) {
  return `<div class="card wide"><h3>${escapar(titulo)}</h3>${sub ? `<p class="sub">${escapar(sub)}</p>` : ""}
    <div class="chart-wrap ${alta ? "alta" : ""}"><canvas id="${id}"></canvas></div></div>`;
}

/* ==================== CONFERÊNCIA ==================== */
function badge(o) {
  const chave = o == null ? "nenhuma" : o;
  const rot = ORIGENS[chave] || (o == null ? "—" : o);
  const attr = ORIGENS_ESPERAVEIS.includes(chave) ? chave : "outra";
  return `<span class="badge" data-o="${attr}">${escapar(rot)}</span>`;
}
function acertouLocal(l) {
  if (!l.origem_obtida || !l.origem_esperada) return null;
  return [l.origem_esperada, ...(l.origem_tambem_ok || [])].includes(l.origem_obtida);
}
function contagem() {
  const c = { satisfeito: 0, insatisfeito: 0, pulado: 0 };
  for (const l of estado.linhas) if (l.veredicto in c) c[l.veredicto]++;
  return c;
}

let listaPendAberta = true;  // lembra o estado do <details> entre re-renders
const ST_ICONE = { pendente: "○", satisfeito: "✓", insatisfeito: "✗", pulado: "–", nao_executada: "⊘" };

function statusLinha(l) {
  if (!l.executada) return "nao_executada";
  return l.veredicto || "pendente";
}

// Próximo índice (circular) de uma pergunta executada e ainda sem veredito.
function proximaPendente(depoisDe) {
  const n = estado.linhas.length;
  for (let k = 1; k <= n; k++) {
    const i = (depoisDe + k) % n;
    const l = estado.linhas[i];
    if (l.executada && !l.veredicto) return i;
  }
  return -1;
}

function listaPendentesHtml() {
  const exec = estado.linhas.map((l, i) => ({ l, i })).filter((x) => x.l.executada);
  if (!exec.length) return "";
  const pend = exec.filter((x) => !x.l.veredicto);
  const ordem = [...pend, ...exec.filter((x) => x.l.veredicto)];  // pendentes primeiro
  const rows = ordem.map(({ l, i }) => {
    const st = statusLinha(l);
    const texto = l.pergunta || l.pergunta_hash;
    return `<button class="pend-item ${l.veredicto ? "feito" : ""}" data-goto="${i}" aria-current="${i === estado.idx}">
      <span class="st ${st}" title="${st}">${ST_ICONE[st]}</span>
      <span class="q" title="${escapar(texto)}">${escapar(texto)}</span>
      ${l.grupo ? `<span class="gr">${escapar(l.grupo)}</span>` : "<span></span>"}
    </button>`;
  }).join("");
  const naoRodaram = estado.linhas.length - exec.length;
  return `
    <details class="lista-pend" id="lista-pend" ${listaPendAberta ? "open" : ""}>
      <summary>
        Pendentes de avaliar
        <span class="badge-n ${pend.length ? "" : "zero"}">${pend.length}</span>
        <span style="font-weight:400;color:var(--texto-fraco)">de ${exec.length} executada${exec.length === 1 ? "" : "s"}${naoRodaram ? ` · ${naoRodaram} não rodaram` : ""}</span>
      </summary>
      ${pend.length === 0 ? '<div class="pend-vazia">Tudo avaliado nesta janela ✓</div>' : ""}
      <div class="corpo">${rows}</div>
      <div class="rodape">
        ${pend.length ? '<button id="pp-btn">Próxima pendente →</button>' : ""}
        <button id="pp-jump-dash">Ver na visão geral</button>
      </div>
    </details>`;
}

      <p class="pergunta">${l.pergunta ? escapar(l.pergunta) : `<span class="vazia">pergunta fora do dataset — hash ${escapar(l.pergunta_hash)}</span>`}</p>
      <div class="meta">
        ${aceitas.length ? `<span class="chip">esperado</span>${aceitas.map(badge).join('<span class="seta">ou</span>')}<span class="seta">→</span>` : ""}
        <span class="chip">obtido</span>${badge(l.origem_obtida)}
        ${acertou === null ? "" : `<span class="chip" data-ok="${acertou ? "sim" : "nao"}">${acertou ? "roteou certo" : "divergiu"}</span>`}
        ${l.grupo ? `<span class="chip">${escapar(l.grupo)}</span>` : ""}
        ${!l.executada ? '<span class="chip" data-ok="nao">não executada nesta janela</span>' : ""}
        ${l.cache_hit ? '<span class="chip">cache hit</span>' : ""}
        ${(l.pii && l.pii.length) ? `<span class="chip" data-ok="nao">PII: ${escapar(l.pii.join(","))}</span>` : ""}
      </div>

      ${l.criterio ? `<div class="criterio"><strong>Critério de conferência (do dataset)</strong>${escapar(l.criterio)}</div>` : ""}

      <div class="rot-secao">Resposta do agente</div>
      ${l.resposta ? `<div class="resposta">${renderizarResposta(l.resposta)}</div>`
        : `<p class="vazia">${l.executada ? "(a telemetria não guardou o texto — canal ≠ eval?)" : "(sem execução na janela)"}</p>`}

      ${l.pergunta_id ? editorExpectativa(l) : ""}

      <div class="rot-secao">Retrieval / custo</div>
      <dl class="grade">${grade.map(([k, v]) => `<div><dt>${escapar(k)}</dt><dd>${escapar(v)}</dd></div>`).join("")}</dl>

      <details class="crua"><summary>Ver linha crua</summary><pre>${escapar(JSON.stringify(l, null, 2))}</pre></details>
    </div>

    <div class="acoes">
      <button class="nav" id="b-volta" ${estado.idx === 0 ? "disabled" : ""}>← Voltar</button>
      ${Object.entries(VEREDICTOS).map(([k, m]) => `<button class="voto ${m.classe}" data-v="${k}" aria-pressed="${l.veredicto === k}" ${podeVotar ? "" : "disabled"}>${m.rotulo} <small>${m.tecla}</small></button>`).join("")}
      <button class="nav" id="b-pendente" title="Pula para a próxima ainda sem veredito (tecla N)">Pendente →</button>
      <button class="nav" id="b-avanca">${estado.idx === revisaveis.length - 1 ? "Fim" : "Pular →"}</button>
    </div>
  `;

  $("b-volta").onclick = () => { estado.idx--; renderRevisao(); };
  $("b-avanca").onclick = () => { estado.idx = Math.min(estado.idx + 1, revisaveis.length - 1); renderRevisao(); };
  $("b-pendente").onclick = irParaProximaPendente;
  $("painel").querySelectorAll("[data-v]").forEach((b) => b.onclick = () => votar(l, b.dataset.v));

  const det = $("lista-pend");
  if (det) {
    det.addEventListener("toggle", () => { listaPendAberta = det.open; });
    $("painel").querySelectorAll("[data-goto]").forEach((b) =>
      b.onclick = () => { estado.idx = +b.dataset.goto; renderRevisao(); });
    const pp = $("pp-btn");
    if (pp) pp.onclick = irParaProximaPendente;
    $("pp-jump-dash").onclick = () => { estado.modo = "dashboard"; render(); };
  }
  ligarEditor(l);
}

function irParaProximaPendente() {
  const i = proximaPendente(estado.idx);
  if (i < 0) { alert("Nenhuma pendente — tudo avaliado nesta janela."); return; }
  estado.idx = i;
  renderRevisao();
}

function editorExpectativa(l) {
  const ajustada = !!l._ajustada;
  const opcoes = ORIGENS_ESPERAVEIS.map((o) => `<option value="${o}" ${o === l.origem_esperada ? "selected" : ""}>${o} — ${ORIGENS[o]}</option>`).join("");
  const checks = ORIGENS_ESPERAVEIS.filter((o) => o !== l.origem_esperada)
    .map((o) => `<label><input type="checkbox" class="ok" value="${o}" ${(l.origem_tambem_ok || []).includes(o) ? "checked" : ""}> ${o}</label>`).join("");
  const acertou = acertouLocal(l);
  return `
    <div class="expectativa ${ajustada ? "aj" : ""}">
      <div class="rot-secao" style="margin:0">Expectativa ${ajustada ? "· <span style=\"color:var(--marca)\">ajustada nesta sessão</span>" : ""}</div>
      <div class="linha">
        <label>origem esperada <select id="e-origem">${opcoes}</select></label>
        <span class="tambem-ok">também ok: ${checks}</span>
      </div>
      <div class="vr">Com esta expectativa: <b data-ok="${acertou ? "sim" : "nao"}">${acertou ? "roteou certo" : "divergiu"}</b></div>
      <div class="vr antes">Salvar faz <code>PATCH /revisao/pergunta/${l.pergunta_id}</code> — vale para as próximas rodadas.</div>
    </div>`;
}

function ligarEditor(l) {
  const sel = $("e-origem");
  if (!sel) return;
  const lerOk = () => [...$("painel").querySelectorAll(".ok:checked")].map((c) => c.value);
  const aplicar = async () => {
    const nova = sel.value;
    const ok = lerOk().filter((o) => o !== nova);
    try {
      const r = await fetch("/revisao/pergunta/" + l.pergunta_id, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ origem_esperada: nova, origem_tambem_ok: ok }),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      l.origem_esperada = d.origem_esperada;
      l.origem_tambem_ok = d.origem_tambem_ok;
      l._ajustada = true;
      renderRevisao();
    } catch (e) { alert("Falha ao salvar expectativa: " + e.message); }
  };
  sel.addEventListener("change", aplicar);
  $("painel").querySelectorAll(".ok").forEach((c) => c.addEventListener("change", aplicar));
}

async function votar(l, v) {
  if (!l.executada) return;
  try {
    const r = await fetch("/revisao/veredicto", {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ telemetria_id: l.telemetria_id, pergunta_hash: l.pergunta_hash, veredicto: v }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    l.veredicto = v;
    // Depois de votar, pula para a próxima PENDENTE (não só a seguinte) — é o
    // fluxo de quem está zerando a lista. Se não houver mais, avança uma.
    const prox = proximaPendente(estado.idx);
    estado.idx = prox >= 0 ? prox : Math.min(estado.idx + 1, estado.linhas.length - 1);
    renderRevisao();
  } catch (e) { alert("Falha ao gravar veredito: " + e.message); }
}

/* ---------- export ---------- */
function baixarJSON() {
  const blob = new Blob([JSON.stringify({ filtros: estado.filtros, resumo: estado.resumo, linhas: estado.linhas }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "revisao-eval.json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function copiarMarkdown() {
  const r = estado.resumo, c = r.roteamento_x_fidelidade;
  const md = [
    `# Revisão de avaliação (${estado.filtros.dias}d${estado.filtros.grupo ? ", grupo " + estado.filtros.grupo : ""})`,
    "",
    `- Acerto de roteamento: ${r.acerto_geral.acertou}/${r.acerto_geral.avaliaveis}` + (r.acerto_geral.taxa !== null ? ` (${Math.round(r.acerto_geral.taxa * 100)}%)` : ""),
    `- Executadas: ${r.executadas} · sem execução: ${r.nao_executadas}`,
    `- Fidelidade: ${r.veredictos.satisfeito} satisfeito / ${r.veredictos.insatisfeito} insatisfeito / ${r.veredictos.sem_veredicto} sem veredito`,
    `- grounded=true: ${r.flags.grounded.sim} · não-grounded: ${r.nao_grounded} · cache hits: ${r.cache_hits} · com PII: ${r.flags.pii.sim} · com erro: ${r.flags.erro.sim}`,
    `- Latência: p50 ${r.latencia_ms.p50} ms · p95 ${r.latencia_ms.p95} ms · média por etapa: retrieve ${r.tempo_por_etapa.ms_retrieve} / rerank ${r.tempo_por_etapa.ms_rerank} / LLM ${r.tempo_por_etapa.ms_llm} / web ${r.tempo_por_etapa.ms_web}`,
    `- Médias: n_chunks ${r.medias.n_chunks} · tokens ${r.medias.input_tokens} in / ${r.medias.output_tokens} out · score_top ${r.medias.score_top}`,
    "",
    "## Roteamento × fidelidade",
    "| | satisfeito | insatisfeito |", "|---|---:|---:|",
    `| roteou certo | ${c.certo_sat} | ${c.certo_insat} |`,
    `| divergiu | ${c.divergiu_sat} | ${c.divergiu_insat} |`,
    "",
    "## Principais tópicos",
    ...r.topicos.map(([t, n]) => `- ${t} — ${n}`),
    "",
    "## Insatisfeitos",
    ...estado.linhas.filter((l) => l.veredicto === "insatisfeito").map((l) =>
      `- **${l.pergunta || l.pergunta_hash}** \`${l.origem_esperada} → ${l.origem_obtida}\`${l.grupo ? " · " + l.grupo : ""}`),
  ].join("\n");
  navigator.clipboard.writeText(md).then(
    () => { $("copiar").textContent = "Copiado ✓"; setTimeout(() => ($("copiar").textContent = "Copiar resumo (Markdown)"), 1500); },
    () => window.prompt("Copie:", md));
}

/* ---------- eventos ---------- */
document.querySelectorAll(".abas button").forEach((b) =>
  b.onclick = () => { estado.modo = b.dataset.modo; render(); });
$("f-dias").addEventListener("change", (e) => { estado.filtros.dias = +e.target.value; carregar(); });
$("f-grupo").addEventListener("change", (e) => { estado.filtros.grupo = e.target.value; carregar(); });
$("f-origem").addEventListener("change", (e) => { estado.filtros.origem = e.target.value; carregar(); });

document.addEventListener("keydown", (e) => {
  if (estado.modo !== "revisao" || !estado.linhas.length) return;
  if (e.target.matches("input, textarea, select")) return;
  const l = estado.linhas[estado.idx];
  const mapa = { "1": "satisfeito", s: "satisfeito", "2": "insatisfeito", i: "insatisfeito", "3": "pulado", p: "pulado" };
  const v = mapa[e.key.toLowerCase()];
  if (v && l && l.executada) { e.preventDefault(); votar(l, v); return; }
  if (e.key.toLowerCase() === "n") { e.preventDefault(); irParaProximaPendente(); return; }
  if (e.key === "ArrowLeft" && estado.idx > 0) { e.preventDefault(); estado.idx--; renderRevisao(); }
  if (e.key === "ArrowRight" && estado.idx < estado.linhas.length - 1) { e.preventDefault(); estado.idx++; renderRevisao(); }
});

carregar();
</script>
</body>
</html>
