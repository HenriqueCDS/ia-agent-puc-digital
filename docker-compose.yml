services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agente-ead-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agente_ead
    ports:
      # 5433 no host: a 5432 já está ocupada por um PostgreSQL nativo instalado
      # no Windows (serviço postgresql-x64-18). Dentro da rede Docker continua 5432.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agente_ead"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
